<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline Pali Converter</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2c3e50">

<style>
body {
    font-family: "Segoe UI", Tahoma, sans-serif;
    padding: 20px;
    max-width: 900px;
    margin: auto;
    background: #f7f9fc;
    color: #333;
}

.container {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 15px #0001;
}

h2 {
    text-align: center;
    color: #2c3e50;
    margin-bottom: 5px;
}

textarea {
    width: 100%;
    height: 120px;
    font-size: 22px;
    padding: 15px;
    margin-bottom: 15px;
    border: 1px solid #ccd1d9;
    border-radius: 7px;
    box-sizing: border-box;
    resize: vertical;
    line-height: 1.6;
}

.buttons-grid,
.action-btns {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-bottom: 20px;
}

.btn {
    padding: 12px 22px;
    cursor: pointer;
    border: 1px solid #d1d8e0;
    background: #f1f2f6;
    border-radius: 7px;
    font-size: 16px;
    font-weight: bold;
}

.btn:hover {
    background: #3498db;
    color: white;
}

.action {
    padding: 10px 30px;
    border: 0;
    border-radius: 7px;
    color: white;
    background: #2ecc71;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.reset {
    background: #e74c3c;
}

.info {
    text-align: center;
    color: #718096;
    font-size: 14px;
    margin-bottom: 15px;
}

.install-bar {
    display: none;
    background: #2c3e50;
    color: white;
    padding: 10px;
    border-radius: 7px;
    text-align: center;
    margin-bottom: 15px;
}

.install-btn {
    background: #f39c12;
    color: white;
    border: none;
    padding: 5px 15px;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
    margin-left: 10px;
}
</style>
</head>

<body>

<div class="container">

<h2>Offline Pali Converter</h2>

<div class="info">
    ไทย ↔ Roman (IAST) ↔ မြန်မာ
    — ทำงานแบบ Offline
</div>

<div id="installBar" class="install-bar">
    ติดตั้งแอปนี้เพื่อใช้งานแบบ Offline บนหน้าจอหลัก
    <button id="installBtn" class="install-btn">ติดตั้งแอป</button>
</div>

<p><b>1) พิมพ์บาลีต้นฉบับ</b></p>

<textarea
    id="inputText"
    placeholder="เช่น โอฏฺฐ, อิติ, นโม ตสฺส หรือ ဩဋ္ဌ"></textarea>

<p><b>2) เลือกอักษรปลายทาง</b></p>

<div class="buttons-grid">

    <button class="btn" onclick="convertText('thai')">
        🇹🇭 ไทย
    </button>

    <button class="btn" onclick="convertText('roman')">
        🔤 Roman (IAST)
    </button>

    <button class="btn" onclick="convertText('burmese')">
        🇲🇲 မြန်မာ
    </button>

</div>

<p><b>ผลลัพธ์</b></p>

<textarea
    id="outputText"
    readonly
    placeholder="ผลลัพธ์..."></textarea>

<div class="action-btns">

    <button class="action" onclick="copyText()">
        Copy
    </button>

    <button class="action reset" onclick="resetText()">
        Reset
    </button>

</div>

</div>

<script>
/* =====================================================
   PALI SCRIPT DATABASE
===================================================== */

const S = {

    thai: {

        C: {
            ก:'k', ข:'kh', ค:'g', ฆ:'gh', ง:'ṅ',
            จ:'c', ฉ:'ch', ช:'j', ฌ:'jh', ญ:'ñ',
            ฏ:'ṭ', ฐ:'ṭh', ฑ:'ḍ', ฒ:'ḍh', ณ:'ṇ',
            ต:'t', ถ:'th', ท:'d', ธ:'dh', น:'n',
            ป:'p', ผ:'ph', พ:'b', ภ:'bh', ม:'m',
            ย:'y', ร:'r', ล:'l', ว:'v',
            ส:'s', ห:'h', ฬ:'ḷ'
        },

        V: {
            'า':'ā',
            'ิ':'i',
            'ี':'ī',
            'ุ':'u',
            'ู':'ū',
            'เ':'e',
            'โ':'o'
        },

        I: {
            'อา':'ā',
            'อิ':'i',
            'อี':'ī',
            'อุ':'u',
            'อู':'ū',
            'เอ':'e',
            'โอ':'o',
            'อ':'a'
        },

        N: 'ํ',
        VIR: 'ฺ',
        pre: true
    },


    burmese: {

        C: {
            က:'k', ခ:'kh', ဂ:'g', ဃ:'gh', င:'ṅ',
            စ:'c', ဆ:'ch', ဇ:'j', ဈ:'jh', ဉ:'ñ',
            ည:'ññ',
            ဋ:'ṭ', ဌ:'ṭh', ဍ:'ḍ', ဎ:'ḍh', ဏ:'ṇ',
            တ:'t', ထ:'th', ဒ:'d', ဓ:'dh', န:'n',
            ပ:'p', ဖ:'ph', ဗ:'b', ဘ:'bh', မ:'m',
            ယ:'y', ရ:'r', လ:'l', ဝ:'v',
            သ:'s', ဟ:'h', ဠ:'ḷ'
        },

        V: {
            'ာ':'ā',
            'ိ':'i',
            'ီ':'ī',
            'ု':'u',
            'ူ':'ū',
            'ေ':'e',
            'ော':'o'
        },

        I: {
            'အာ':'ā',
            'ဣ':'i',
            'ဤ':'ī',
            'ဥ':'u',
            'ဦ':'ū',
            'ဧ':'e',
            'ဩ':'o',
            'အ':'a'
        },

        N: 'ံ',
        VIR: '္',
        pre: false
    }

};


/* =====================================================
   ROMAN TOKEN TABLE
===================================================== */

const CROM = [
    'kh','gh','ch','jh',
    'ṭh','ḍh','th','dh','ph','bh',
    'ññ','ñ','ṅ',
    'ṭ','ḍ','ṇ','ḷ',
    'k','g','c','j','t','d','n',
    'p','b','m','y','r','l','v','s','h'
];

const VROM = [
    'ā','ī','ū',
    'a','i','u','e','o'
];


/* =====================================================
   DETECT SCRIPT
===================================================== */

function detect(text) {

    if (/[\u0E00-\u0E7F]/.test(text)) {
        return 'thai';
    }

    if (/[\u1000-\u109F]/.test(text)) {
        return 'burmese';
    }

    return 'roman';
}


/* =====================================================
   SCRIPT → ROMAN
===================================================== */

function romanize(text, src) {

    if (src === 'roman') {
        return text
            .replace(/ṁ/g, 'ṃ')
            .normalize('NFC');
    }

    const m = S[src];

    if (src === 'burmese') {
        text = text.replace(/ါ/g, 'ာ');
        text = text.replace(/ဿ/g, 'သ္သ');
    }

    for (
        const k of Object.keys(m.I)
            .sort((a,b) => b.length - a.length)
    ) {
        text = text.split(k).join(m.I[k]);
    }

    if (src === 'thai') {
        const keys = Object.keys(m.C).join('');
        const re =
            new RegExp(
                '([เโ])([' + keys + '])',
                'g'
            );
        text = text.replace(re, '$2$1');
    }

    let out = '';
    const chars = [...text];

    for (let i = 0; i < chars.length; i++) {
        const ch = chars[i];

        if (m.C[ch]) {
            out += m.C[ch];
            const next = chars[i + 1];

            if (next === m.VIR) {
                continue;
            }

            if (next && m.V[next]) {
                continue;
            }

            out += 'a';
        }
        else if (m.V[ch]) {
            out += m.V[ch];
        }
        else if (ch === m.N) {
            out += 'ṃ';
        }
        else if (ch === m.VIR) {
            /* do nothing */
        }
        else {
            out += ch;
        }
    }

    return out;
}


/* =====================================================
   ROMAN TOKENIZER
===================================================== */

function tokenize(text) {

    text = text
        .replace(/ṁ/g,'ṃ')
        .normalize('NFC');

    const tokens = [];
    let i = 0;

    while (i < text.length) {
        const two = text.slice(i, i + 2);

        if (CROM.includes(two)) {
            tokens.push({
                type:'C',
                val:two
            });
            i += 2;
            continue;
        }

        const ch = text[i];

        if (CROM.includes(ch)) {
            tokens.push({
                type:'C',
                val:ch
            });
        }
        else if (VROM.includes(ch)) {
            tokens.push({
                type:'V',
                val:ch
            });
        }
        else if (ch === 'ṃ') {
            tokens.push({
                type:'N',
                val:ch
            });
        }
        else {
            tokens.push({
                type:'O',
                val:ch
            });
        }

        i++;
    }

    return tokens;
}


/* =====================================================
   ROMAN → SCRIPT
===================================================== */

function fromRoman(text, dst) {

    if (dst === 'roman') {
        return text;
    }

    const m = S[dst];

    const rc = {};
    for (const k in m.C) {
        rc[m.C[k]] = k;
    }

    const rv = {};
    for (const k in m.V) {
        rv[m.V[k]] = k;
    }

    const ri = {};
    for (const k in m.I) {
        ri[m.I[k]] = k;
    }

    const tokens = tokenize(text);
    let out = '';

    for (let i = 0; i < tokens.length; i++) {
        const [type, val] = [
            tokens[i].type,
            tokens[i].val
        ];

        if (type === 'C') {
            const c = rc[val] || val;
            const next = tokens[i + 1];

            if (next && next.type === 'V') {
                const v = next.val;

                if (
                    dst === 'thai' &&
                    (v === 'e' || v === 'o')
                ) {
                    out += rv[v] + c;
                }
                else {
                    out += c + (rv[v] || '');
                }
                i++;
            }
            else if (
                next &&
                next.type === 'C'
            ) {
                out += c + m.VIR;
            }
            else {
                out += c;
            }
        }
        else if (type === 'V') {
            out += ri[val] || val;
        }
        else if (type === 'N') {
            out += m.N;
        }
        else {
            out += val;
        }
    }

    if (dst === 'burmese') {
        out = out.replace(/သ္သ/g, 'ဿ');
        out = out.replace(/([ခဂငဒဓပဝ])ာ/g, '$1ါ');
    }

    return out;
}


/* =====================================================
   CONVERT
===================================================== */

function convertText(destination) {
    const input = document.getElementById('inputText').value;

    if (!input.trim()) {
        return;
    }

    const source = detect(input);
    const roman = romanize(input, source);
    const result = fromRoman(roman, destination);

    document.getElementById('outputText').value = result;
}


/* =====================================================
   COPY & RESET
===================================================== */

async function copyText() {
    const output = document.getElementById('outputText');

    if (!output.value) {
        return;
    }

    try {
        await navigator.clipboard.writeText(output.value);
    } catch (e) {
        output.select();
        document.execCommand('copy');
    }
}

function resetText() {
    document.getElementById('inputText').value = '';
    document.getElementById('outputText').value = '';
}


/* =====================================================
   SERVICE WORKER & PWA INSTALL
===================================================== */

if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('SW Registered:', reg.scope))
            .catch(err => console.error('SW Registration failed:', err));
    });
}

let deferredPrompt;
const installBar = document.getElementById('installBar');
const installBtn = document.getElementById('installBtn');

window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBar.style.display = 'block';
});

installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') {
        installBar.style.display = 'none';
    }
    deferredPrompt = null;
});
</script>

</body>
</html>
